<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股上市公司商业模式拆解 · 上市以来</title>
<meta name="description" content="按「服务领域 × 货币化引擎 × 付费对象 × 时间」四轴框架，拆解A股上市公司从上市至今的收入结构、定价权与变迁。">
<style>
:root{
  --paper:#faf8f4; --paper-2:#f4f0e8; --paper-3:#ece6da;
  --ink:#1b1a17; --ink-2:#4b4842; --ink-3:#8b877d; --ink-4:#b3aea2;
  --line:#e4ded1; --line-2:#d2cab9;
  --accent:#b4471f; --accent-2:#d4693c; --accent-soft:#f2e3d9;
  --green:#2f5d5a; --green-soft:#dfe8e6;
  --gold:#9c7a28; --blue:#3d5a80;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.75;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:#fff}
a{color:inherit}

/* 顶栏 */
header{
  position:sticky;top:0;z-index:50;background:rgba(250,248,244,.94);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.hd{max-width:1360px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.hd h1{font-size:16px;font-weight:700;letter-spacing:-.01em}
.hd .sub{font-size:11.5px;color:var(--ink-3);letter-spacing:.02em}
.hd .tabs{display:flex;gap:2px;margin-left:6px}
.hd .tab{font-size:11.5px;padding:5px 12px;border:1px solid var(--line-2);background:transparent;color:var(--ink-3);cursor:pointer;font-family:inherit;border-radius:2px;transition:.15s}
.hd .tab:hover{color:var(--ink);border-color:var(--ink-3)}
.hd .tab.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.hd .stats{margin-left:auto;display:flex;gap:20px;font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.hd .stats b{color:var(--ink);font-weight:600;font-size:13px;margin-right:3px}
.hd .stats .statwarn{color:#b45309;border:1px dashed #d9a441;border-radius:999px;padding:1px 8px}

/* 布局 */
.main{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:296px 1fr;gap:0;min-height:calc(100vh - 58px)}
.side{border-right:1px solid var(--line);padding:20px 0 40px;position:sticky;top:58px;align-self:start;max-height:calc(100vh - 58px);display:flex;flex-direction:column}
.search{margin:0 16px 12px;position:relative}
.search input{
  width:100%;padding:8px 10px 8px 30px;border:1px solid var(--line-2);background:#fff;
  font-family:inherit;font-size:12.5px;color:var(--ink);outline:none;border-radius:2px;
}
.search input:focus{border-color:var(--ink-3)}
.search::before{content:"⌕";position:absolute;left:10px;top:6px;color:var(--ink-4);font-size:14px}
.filters{display:flex;flex-wrap:wrap;gap:5px;margin:0 16px 14px}
.chip{
  font-size:10.5px;padding:3px 8px;border:1px solid var(--line-2);background:transparent;
  color:var(--ink-3);cursor:pointer;font-family:inherit;border-radius:2px;transition:.15s;
}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.clist{overflow-y:auto;flex:1;padding:0 8px}
.citem{
  display:block;width:100%;text-align:left;background:transparent;border:none;border-left:2px solid transparent;
  padding:9px 10px;cursor:pointer;font-family:inherit;transition:.15s;
}
.citem:hover{background:var(--paper-2)}
.citem.on{background:var(--paper-3);border-left-color:var(--accent)}
.citem .n{font-size:13px;font-weight:600;color:var(--ink);letter-spacing:-.01em;display:flex;justify-content:space-between;gap:6px}
.citem .m{font-size:10.5px;color:var(--ink-4);font-family:var(--mono);margin-top:2px;display:flex;justify-content:space-between}
.citem .v{font-size:11px;color:var(--ink-3);margin-top:5px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* 内容区 */
.detail{padding:34px 40px 80px;min-width:0}
.empty{padding:120px 40px;color:var(--ink-3);font-size:13px}

.dhead{border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:26px}
.dhead .eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;font-family:var(--mono)}
.dhead h2{font-size:clamp(24px,3vw,34px);line-height:1.25;font-weight:700;letter-spacing:-.02em;margin-bottom:10px}
.dhead .meta{font-size:12px;color:var(--ink-3);display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono)}
.dhead .verdict{font-size:15.5px;line-height:1.8;color:var(--ink-2);margin-top:16px;max-width:46em}
.dhead .verdict b{color:var(--accent)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:32px}
.kpi{padding:16px 18px 16px 0;border-right:1px solid var(--line)}
.kpi:last-child{border-right:none}
.kpi .k{font-size:10px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase;margin-bottom:6px}
.kpi .v{font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.kpi .v small{font-size:.5em;color:var(--ink-3);margin-left:2px;font-weight:400}
.kpi .s{font-size:10.5px;color:var(--ink-4);margin-top:4px;font-family:var(--mono)}

.block{margin-bottom:34px}
.block h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px;display:flex;align-items:center;gap:10px}
.block h3::after{content:"";flex:1;height:1px;background:var(--line)}

.chart{background:#fff;border:1px solid var(--line);padding:18px 16px 10px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;font-size:11px;color:var(--ink-3);margin-top:8px;padding-left:4px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;display:block}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.box{background:#fff;border:1px solid var(--line);padding:20px 22px}
.box .lab{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.box p{font-size:13px;color:var(--ink-2);line-height:1.85}
.box .kv{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-2)}

.mix{margin-top:6px}
.mix-row{display:grid;grid-template-columns:132px 1fr 46px;align-items:center;gap:12px;margin-bottom:7px;font-size:12px}
.mix-row .nm{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mix-row .bar{height:8px;background:var(--paper-3)}
.mix-row .bar i{display:block;height:100%;background:var(--accent-2);opacity:.8}
.mix-row .pc{font-family:var(--mono);font-size:11px;color:var(--ink-3);text-align:right}

table{width:100%;border-collapse:collapse;font-size:12px;font-family:var(--mono)}
th{text-align:right;font-size:9.5px;letter-spacing:.08em;color:var(--ink-3);font-weight:500;padding:0 8px 8px 0;border-bottom:1px solid var(--line-2);text-transform:uppercase}
th:first-child{text-align:left}
td{padding:6px 8px 6px 0;text-align:right;border-bottom:1px solid var(--line);color:var(--ink-2)}
td:first-child{text-align:left;color:var(--ink-3)}
tr:last-child td{border-bottom:none}
td.neg{color:var(--accent)}

.flags{list-style:none}
.flags li{position:relative;padding-left:16px;font-size:12.5px;color:var(--ink-2);line-height:1.8;margin-bottom:6px}
.flags li::before{content:"—";position:absolute;left:0;color:var(--accent)}
.flags li.ok::before{color:var(--green)}

.foot{border-top:1px solid var(--line);margin-top:40px;padding-top:16px;font-size:11px;color:var(--ink-4);line-height:1.9}

/* 导出按钮 */
.xbtn{font-size:11px;padding:5px 12px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;font-family:inherit;border-radius:2px;transition:.15s;margin-left:auto;white-space:nowrap}
.xbtn:hover{background:var(--accent);color:#fff}

/* 横比 */
.cmp-scroll{overflow-x:auto}
.cmp-table{min-width:680px}
.cmp-table tr{cursor:pointer}
.cmp-table tr:hover td{background:var(--paper-2)}
.cmp-table tr.sel td{background:var(--accent-soft)}
.cmp-note{font-size:11.5px;color:var(--ink-3);margin-top:12px;line-height:1.8}
.filterlab{font-size:10px;letter-spacing:.1em;color:var(--ink-4);text-transform:uppercase;margin:2px 0 6px 2px}
.cmp-scope{font-size:11.5px;color:var(--ink-3);margin:-4px 0 12px;line-height:1.75;
  padding-left:10px;border-left:2px solid var(--paper-3)}
.cmp-scope b{color:var(--ink-2);font-weight:600}

/* 估值分位 */
.pctgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:20px}
.pctcell .pl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.pctbar .track{position:relative;height:6px;background:var(--paper-3);border-radius:1px}
.pctbar .track i{position:absolute;left:0;top:0;height:6px;background:linear-gradient(90deg,var(--green-soft),var(--accent-soft));border-radius:1px}
.pctbar .track b{position:absolute;top:-3px;width:4px;height:12px;background:var(--accent);transform:translateX(-2px);border-radius:1px}
.pctbar .scale{display:flex;justify-content:space-between;font-size:9px;color:var(--ink-4);font-family:var(--mono);margin-top:4px}
.pctbar.na{height:6px;background:repeating-linear-gradient(45deg,var(--paper-3),var(--paper-3) 4px,transparent 4px,transparent 8px);display:flex;align-items:center}
.pctbar.na span{display:none}
.pctcell .phint{font-size:10px;color:var(--ink-4);margin-top:4px}
.chart .legend{display:flex;gap:18px;font-size:10.5px;color:var(--ink-3);padding:6px 2px 2px;font-family:var(--mono)}
.chart .legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:6px}
.chart .legend .legend-note{color:var(--ink-4);margin-left:auto}
.chart .legend .clip-note{color:var(--accent);margin-left:auto;font-size:10px}

/* 横切面 */
.xs-toolbar{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.xs-toolbar select{font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line-2);background:#fff;color:var(--ink);border-radius:2px;outline:none}
.xs-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);background:#fff;margin-bottom:28px}
.xs-stat{padding:16px 18px;border-right:1px solid var(--line)}
.xs-stat:last-child{border-right:none}
.xs-stat .k{font-size:10px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase;margin-bottom:6px}
.xs-stat .v{font-family:var(--mono);font-size:20px;font-weight:600}
.xs-stat .s{font-size:10.5px;color:var(--ink-4);margin-top:4px;font-family:var(--mono)}
.bar-h{height:7px;background:var(--paper-3);border-radius:1px;overflow:hidden}
.bar-h i{display:block;height:100%;background:var(--accent-2);opacity:.85}
.growth-pos{color:var(--green)}
.growth-neg{color:var(--accent)}

@media(max-width:960px){
  .xs-stats{grid-template-columns:1fr 1fr}
  .xs-stat:nth-child(2){border-right:none}
  .xs-stat:nth-child(1),.xs-stat:nth-child(2){border-bottom:1px solid var(--line)}
  .hd .tabs{order:3;width:100%;margin-left:0}
  .xbtn{margin-left:0}
}

@media(max-width:960px){
  .main{grid-template-columns:1fr}
  .side{position:static;max-height:none;border-right:none;border-bottom:1px solid var(--line);padding-bottom:14px}
  .clist{max-height:210px}
  .detail{padding:24px 20px 60px}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi:nth-child(2){border-right:none}
  .kpi:nth-child(1),.kpi:nth-child(2){border-bottom:1px solid var(--line)}
  .grid2{grid-template-columns:1fr}
  .pctgrid{grid-template-columns:1fr;gap:14px}
  .chart{padding:12px 8px 6px}
  .chart .legend{flex-wrap:wrap;gap:10px}
  .chart .legend .legend-note{margin-left:0;width:100%}
  /* 窄屏下 SVG 等比缩小会让 9.5px 的字缩到 4px 不可读，故隐藏点上的数值标签，保留轴刻度与悬浮提示 */
  .chart .ptlbl{display:none}
  .hd{padding:12px 20px}
  .hd .stats{display:none}
}
</style>
</head>
<body>
<header>
  <div class="hd">
    <h1>A股上市公司 · 商业模式拆解</h1>
    <div class="sub">服务领域 × 货币化引擎 × 付费对象 × 时间</div>
    <nav class="tabs" id="tabs">
      <button class="tab on" data-mode="company">单家公司</button>
      <button class="tab" data-mode="cross">年度横切面</button>
    </nav>
    <div class="stats" id="hdStats"></div>
  </div>
</header>

<div class="main">
  <aside class="side">
    <div class="search"><input id="q" type="text" placeholder="搜索公司名 / 代码 / 行业"></div>
    <div class="filters" id="filters"></div>
    <div class="filterlab" id="sw2Head" style="display:none">申万二级</div>
    <div class="filters" id="sw2Filters" style="margin-top:-8px;display:none"></div>
    <div class="filters" id="engFilters" style="margin-top:-8px"></div>
    <div class="clist" id="clist"></div>
  </aside>
  <main class="detail" id="detail"></main>
</div>

<script>
const DATA = __DATA_JSON__;
const META = __META_JSON__;

const $ = (s) => document.querySelector(s);
const fmt = (x, d=0) => (x==null || isNaN(x)) ? "—" : x.toLocaleString("zh-CN",{minimumFractionDigits:d,maximumFractionDigits:d});

let state = { q:"", ind:"全部", sw2:"全部", eng:"全部", code: DATA.companies[0]?.code, mode:"company" };

/* 顶栏统计 */
(function(){
  const cs = DATA.companies;
  const rev = cs.reduce((s,c)=> s + (c.years.at(-1)?.rev || 0), 0);
  // 行业数按申万口径算：跨市场 6 家用的是「互联网 / 消费电子」两个自定义标签，
  // 直接数标签会得到 33 个，比申万一级的 31 个还多，读者会以为覆盖更广了。
  const SW = new Set(["农林牧渔","基础化工","钢铁","有色金属","电子","家用电器","食品饮料",
    "纺织服饰","轻工制造","医药生物","公用事业","交通运输","房地产","商贸零售","社会服务",
    "银行","非银金融","综合","建筑材料","建筑装饰","电力设备","机械设备","国防军工","汽车",
    "美容护理","计算机","传媒","通信","煤炭","石油石化","环保"]);
  const swHit = SW.size ? [...new Set(cs.map(c=>c.industry))].filter(i=>SW.has(i)).length : 0;
  const noVal = cs.filter(c=>!c.valuation).length;
  $("#hdStats").innerHTML = `
    <div><b>${cs.length}</b>家公司</div>
    <div><b>${swHit}</b>/31 个申万行业</div>
    <div><b>${cs.reduce((s,c)=>s+c.years.length,0)}</b>个财年</div>
    <div><b>${fmt(rev)}</b>亿元营收合计</div>`
    + (noVal ? `<div class="statwarn" title="这些公司的估值分位尚未取到，详情页会整块隐藏">${noVal} 家待补估值</div>` : "");
})();

/* 行业筛选 */
(function(){
  const inds = ["全部", ...new Set(DATA.companies.map(c=>c.industry))];
  $("#filters").innerHTML = inds.map(i=>`<button class="chip${i===state.ind?' on':''}" data-i="${i}">${i}</button>`).join("");
  $("#filters").onclick = e => {
    const b = e.target.closest(".chip"); if(!b) return;
    state.ind = b.dataset.i;
    document.querySelectorAll("#filters .chip").forEach(x=>x.classList.toggle("on", x===b));
    renderSw2Chips();
    renderList();
  };
})();

/* 申万二级筛选：与一级行业联动。
   一级选「全部」时二级类目多达 87 个，会占满侧栏，因此默认折叠；
   选定某个一级行业后自动展开并只列该行业下的二级类目。 */
function renderSw2Chips(){
  const cs = DATA.companies;
  const scoped = state.ind !== "全部";
  const pool = scoped ? cs.filter(c=>c.industry===state.ind) : [];
  const pairs = [...new Map(pool.filter(c=>c.sw2).map(c=>[c.sw2, c])).values()]
    .sort((a,b)=>(a.sw2_code||"").localeCompare(b.sw2_code||""));
  const box = $("#sw2Filters");
  const head = $("#sw2Head");
  if(!scoped){
    state.sw2 = "全部";
    box.style.display = "none";
    box.innerHTML = "";
    if(head) head.style.display = "none";
    return;
  }
  if(state.sw2 !== "全部" && !pairs.some(c=>c.sw2===state.sw2)) state.sw2 = "全部";
  box.style.display = "";
  if(head) head.style.display = "";
  box.innerHTML = ["全部", ...pairs.map(c=>c.sw2)]
    .map(x=>`<button class="chip${x===state.sw2?' on':''}" data-s="${x}">${x}</button>`).join("");
}

/* 申万二级筛选的点击与初始化 */
(function(){
  renderSw2Chips();
  $("#sw2Filters").onclick = e => {
    const b = e.target.closest(".chip"); if(!b) return;
    state.sw2 = b.dataset.s;
    document.querySelectorAll("#sw2Filters .chip").forEach(x=>x.classList.toggle("on", x===b));
    renderList();
  };
})();

/* 引擎筛选 */
(function(){
  const engs = ["E1广告","E2佣金","E3自营","E4履约","E5订阅","E6金融","E7云","E8交付","E9资源"];
  $("#engFilters").innerHTML = ["全部", ...engs].map(e=>`<button class="chip${e===state.eng?' on':''}" data-e="${e}">${e}</button>`).join("");
  $("#engFilters").onclick = e => {
    const b = e.target.closest(".chip"); if(!b) return;
    state.eng = b.dataset.e;
    document.querySelectorAll("#engFilters .chip").forEach(x=>x.classList.toggle("on", x===b));
    renderList();
  };
})();

/* 视图切换：单家公司 / 年度横切面 */
(function(){
  $("#tabs").onclick = e => {
    const b = e.target.closest(".tab"); if(!b) return;
    state.mode = b.dataset.mode;
    document.querySelectorAll("#tabs .tab").forEach(x=>x.classList.toggle("on", x===b));
    if(state.mode==="cross"){ renderCross(); } else { renderDetail(); }
  };
})();

function match(c){
  const q = state.q.trim().toLowerCase();
  const okInd = state.ind === "全部" || c.industry === state.ind;
  const okSw2 = !state.sw2 || state.sw2 === "全部" || c.sw2 === state.sw2;
  const okEng = state.eng === "全部" || engineTag(c).includes(state.eng);
  const okQ = !q || (c.name+c.code+c.industry+(c.sub||"")+(c.sw2||"")+c.verdict).toLowerCase().includes(q);
  return okInd && okSw2 && okEng && okQ;
}

function renderList(){
  const cs = DATA.companies.filter(match);
  $("#clist").innerHTML = cs.length ? cs.map(c=>`
    <button class="citem${c.code===state.code?' on':''}" data-c="${c.code}">
      <div class="n">${c.name}<span style="font-family:var(--mono);font-size:10px;color:var(--ink-4);font-weight:400">${c.code.split(".")[0]}</span></div>
      <div class="m"><span>${c.industry}</span><span>${c.coverage[0]}–${c.coverage[1]}</span></div>
      <div class="v">${c.verdict.replace(/<\/?b>/g,"")}</div>
    </button>`).join("") : `<div style="padding:24px 12px;color:var(--ink-4);font-size:12px">没有匹配的公司</div>`;
}

$("#clist").onclick = e => {
  const b = e.target.closest(".citem"); if(!b) return;
  state.code = b.dataset.c;
  renderList(); renderDetail();
  window.scrollTo({top:0,behavior:"smooth"});
};
$("#q").oninput = e => { state.q = e.target.value; renderList(); };

/* 图表：营收柱 + 净利线 */
function chart(c){
  const ys = c.years;
  const W = 720, H = 260, P = {l:46, r:44, t:14, b:26};
  const iw = W-P.l-P.r, ih = H-P.t-P.b;
  const maxRev = Math.max(...ys.map(d=>d.rev), 1);

  const maxY = maxRev;
  const bw = iw/ys.length;
  const x = i => P.l + bw*i;
  // 零轴不贴底：上方 62% 留给营收柱与正净利，下方 38% 留给负净利，
  // 否则亏损年份的净利点会画到画布外被裁掉（美团 2021/2025、京东 2021 都踩过这个坑）。
  // 若样本从未亏损（如腾讯 22 年、茅台），则压缩负区间为 0，让柱子用满整个高度。
  const hasNeg = ys.some(d=>d.np < 0);
  const UP = hasNeg ? 0.62 : 1.0, DOWN = hasNeg ? 0.38 : 0;
  const zero = P.t + ih*UP;
  const yR = v => zero - (v/maxY)*ih*UP;

  let g = "";
  // 网格（营收刻度，从零轴向上）
  for(let k=0;k<=4;k++){
    const v = maxY*k/4, yy = yR(v);
    g += `<line x1="${P.l}" y1="${yy}" x2="${W-P.r}" y2="${yy}" stroke="#e4ded1" stroke-width="1"/>`;
    g += `<text x="${P.l-8}" y="${yy+3.5}" text-anchor="end" font-size="9" fill="#b3aea2" font-family="ui-monospace,monospace">${v>=1000?(v/1000).toFixed(1)+'k':Math.round(v)}</text>`;
  }
  // 柱
  ys.forEach((d,i)=>{
    const h = Math.max(zero - yR(d.rev), 1);
    g += `<rect x="${x(i)+bw*0.18}" y="${yR(d.rev)}" width="${bw*0.64}" height="${h}" fill="#e0d6c6"/>`;
  });
  // 净利线（按自身量级缩放，避免被营收压平）
  // 定标池排除「非经营性极值」（years[].flag === "nonop"），如美团 2018 年 -1154.77 亿含
  // 优先股公允价值变动约 1046 亿——它不是经营结果，若参与定标会把其余年份压成直线，
  // 读者会误以为「美团常年微利、波动很小」。
  // 注意：只排除显式标记的年份。京东方 2021 年 258 亿、荣盛 2021 年 128 亿这类
  // 真实的周期高点必须正常显示，交给算法按统计规则去猜（P90/IQR）反而会误截断。
  const nonop = new Set(ys.filter(d=>d.flag === "nonop").map(d=>d.y));
  const pool = ys.filter(d=>!nonop.has(d.y)).map(d=>Math.abs(d.np));
  const maxNp = Math.max(...pool, 1);
  const yNp = v => {
    const t = Math.max(-1, Math.min(1, v/maxNp));
    return t >= 0 ? zero - t*ih*UP : zero + (-t)*ih*DOWN;
  };
  const pts = ys.map((d,i)=> [x(i)+bw/2, yNp(d.np)]);
  g += `<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#b4471f" stroke-width="2"/>`;
  pts.forEach((p,i)=>{
    const d = ys[i];
    const clipped = Math.abs(d.np) > maxNp * 1.001;
    if(clipped){
      // 超界：三角标记，方向指示真实值在界外
      const dir = d.np < 0 ? 1 : -1;
      g += `<path d="M${p[0]},${p[1]+dir*5} L${p[0]-4.5},${p[1]-dir*3} L${p[0]+4.5},${p[1]-dir*3} Z" fill="#b4471f"><title>${d.y} 净利 ${fmt(d.np,1)} 亿元（超出坐标范围，已截断显示）</title></path>`;
    } else {
      g += `<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="${d.np<0?'#b4471f':'#faf8f4'}" stroke="#b4471f" stroke-width="1.6"><title>${d.y} 净利 ${fmt(d.np,1)} 亿元</title></circle>`;
    }
  });
  // 右侧净利刻度：净利线按自身量级缩放（否则会被营收压平），必须给出独立刻度，
  // 否则读者会把「2024 年净利点高于营收柱顶」误读成利润大于营收。
  const npTicks = hasNeg
    ? [[maxNp, zero - ih*UP], [0, zero], [-maxNp, zero + ih*DOWN]]
    : [[maxNp, zero - ih*UP], [0, zero]];
  npTicks.forEach(([v,yy])=>{
    g += `<text x="${W-P.r+7}" y="${yy+3.5}" text-anchor="start" font-size="8.5" fill="#b4471f" font-family="ui-monospace,monospace">${Math.abs(v)>=1000?(v/1000).toFixed(1)+'k':Math.round(v)}</text>`;
  });
  g += `<text x="${W-P.r+7}" y="${P.t-2}" text-anchor="start" font-size="8.5" fill="#b4471f" font-family="ui-monospace,monospace" letter-spacing="1">净利</text>`;
  // x 轴
  const step = ys.length > 18 ? Math.ceil(ys.length/9) : (ys.length>10?2:1);
  ys.forEach((d,i)=>{
    if(i%step===0 || i===ys.length-1){
      g += `<text x="${x(i)+bw/2}" y="${H-6}" text-anchor="middle" font-size="9" fill="#b3aea2" font-family="ui-monospace,monospace">${String(d.y).slice(2)}</text>`;
    }
  });
  g += `<line x1="${P.l}" y1="${zero}" x2="${W-P.r}" y2="${zero}" stroke="#d2cab9" stroke-width="1"/>`;
  // 若有被截断的年份，说明放在图例区（放在 svg 内会压住网格与左上角刻度）
  const clippedYears = ys.filter(d=>Math.abs(d.np) > maxNp*1.001).map(d=>d.y);
  const clipNote = clippedYears.length
    ? `<span class="clip-note">▲▼ ${clippedYears.join('/')} 年净利超出坐标范围，已截断显示</span>`
    : "";
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${c.name}营收与净利润">${g}</svg>
    <div class="legend"><span><i style="background:#e0d6c6"></i>营业收入（亿元）</span><span><i style="background:var(--accent)"></i>归母净利润（按自身量级缩放）</span>${clipNote}</div></div>`;
}

/* 公司级别指标 */
function companyStats(c){
  const ys = c.years, first = ys[0], last = ys.at(-1);
  const n = last.y - first.y;
  const cagr = (n>0 && first.rev>0 && last.rev>0) ? (Math.pow(last.rev/first.rev, 1/n)-1)*100 : null;
  const npCagr = (n>0 && first.np>0 && last.np>0) ? (Math.pow(last.np/first.np, 1/n)-1)*100 : null;
  const nm = last.rev>0 ? last.np/last.rev*100 : null;
  return {first, last, cagr, npCagr, nm};
}

/* 金融机构专用指标 */
function financialBlock(c){
  const f = c.financial;
  if(!f) return "";
  const head = f.type==="bank"
    ? `<thead><tr><th>年度</th><th>净息差</th><th>不良率</th><th>成本收入比</th><th>拨备覆盖率</th><th>加权ROE</th></tr></thead>`
    : `<thead><tr><th>年度</th><th>新业务价值(亿)</th><th>内含价值(亿)</th><th>NBV率</th></tr></thead>`;
  const rows = f.years.map(d=> f.type==="bank"
    ? `<tr><td>${d.y}</td><td>${d.nim}%</td><td>${d.npl}%</td><td>${d.cir}%</td><td>${d.cov}%</td><td>${d.roe}%</td></tr>`
    : `<tr><td>${d.y}</td><td>${fmt(d.nbv,1)}</td><td>${fmt(d.ev,0)}</td><td>${d.nbvm}%</td></tr>`
  ).join("");
  const note = f.type==="bank"
    ? "银行不适用制造业毛利率，核心看净息差与信用成本。净息差逐年下行是利率环境的行业性问题，判断看下行斜率是否快于同业，以及拨备覆盖率是否仍有余量。"
    : "保险看死差+费差+利差。NBV（新业务价值）是未来利润的先行指标，内含价值是存量业务的清算价值；NBV率受新单产品结构影响，2023 年低点与产品切换有关。";
  return `
    <div class="block">
      <h3>金融机构专用指标</h3>
      <div class="cmp-scroll"><table>${head}<tbody>${rows}</tbody></table></div>
      <div class="cmp-note">${note}</div>
    </div>`;
}

/* 估值分位：把 0–100 的数变成一句人话 */
function pctWord(p){
  if(p==null) return "样本不足";
  if(p<=10) return "极低位";
  if(p<=30) return "低位";
  if(p<=70) return "中位";
  if(p<=90) return "高位";
  return "极高位";
}

/* 分位条：一个 0–100 的横向刻度 + 当前位置游标 */
function pctBar(p){
  if(p==null) return `<div class="pctbar na"><span>样本不足，不计算分位</span></div>`;
  return `<div class="pctbar"><div class="track"><i style="width:${p}%"></i><b style="left:${p}%"></b></div>
    <div class="scale"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div></div>`;
}

/* 估值走势：PE / PB 双折线（窗口 10 年，上市晚的公司自然更短）
   两条线各自归一化到自身 min–max，共用画布；标签交替上下错位，避免相近年份标签压字。 */
function valChart(v){
  const h = v.history || [];
  if(h.length < 2) return "";
  // 窄屏用更小的 viewBox，让同样的 9.5px 字号在等比缩放后实际显示更大
  const narrow = (typeof window !== "undefined") && window.innerWidth <= 960;
  const W = narrow ? 360 : 720, H = narrow ? 200 : 220;
  const P = narrow ? {l:30, r:30, t:24, b:26} : {l:52, r:52, t:26, b:30};
  const iw = W-P.l-P.r, ih = H-P.t-P.b;
  const n = h.length;
  const FS = narrow ? 8.5 : 9.5;
  const x = i => P.l + (n===1 ? iw/2 : iw*i/(n-1));

  const series = [];
  // 负 PE 不参与绘制：亏损年份的 PE 是「分母为负」算出来的，画进图里会把整条
  // PE 线的纵轴压扁（华能 2021 年 PE = -40.2，其余年份 8–17 全被挤到顶部）。
  // 缺失年份（停牌、退市前）同理——折线应在缺口处断开，而不是强行连过去。
  const usable = (d, key) => d[key] != null && !(key === "pe" && d[key] <= 0);
  const draw = (key, color, side) => {
    const vals = h.filter(d => usable(d, key)).map(d => d[key]);
    if(!vals.length) return;
    const lo = Math.min(...vals), hi = Math.max(...vals);
    const span = (hi-lo) || 1;
    const y = val => P.t + ih - ((val-lo)/span)*ih*0.86 - ih*0.07;
    let pts = [];
    h.forEach((d,i)=>{ if(usable(d,key)) pts.push([x(i), y(d[key]), d[key], d.y, i]); });
    // 按原始下标切成连续段：下标断档说明中间年份无有效值，不能连线
    const segs = [];
    let cur = [];
    pts.forEach(pt => {
      if(cur.length && pt[4] - cur[cur.length-1][4] > 1){ segs.push(cur); cur = []; }
      cur.push(pt);
    });
    if(cur.length) segs.push(cur);
    series.push({key, color, side, pts, segs, lo, hi});
  };
  draw("pe", "#b4471f", "left");
  draw("pb", "#3d5a80", "right");

  // 网格
  let g = "";
  for(let k=0;k<=3;k++){
    const yy = P.t + ih*k/3;
    g += `<line x1="${P.l}" y1="${yy}" x2="${W-P.r}" y2="${yy}" stroke="#efe9dd" stroke-width="1"/>`;
  }
  // 轴标题放在画布顶部独立一行，刻度贴到轴末端，避免与数据标签抢位置
  const axisLbl = (s) => {
    const tx = s.side==="left" ? 6 : W-6;
    const anchor = s.side==="left" ? "start" : "end";
    const txTick = s.side==="left" ? P.l-8 : W-P.r+8;
    const anchorTick = s.side==="left" ? "end" : "start";
    return `<text x="${tx}" y="${P.t-14}" text-anchor="${anchor}" font-size="${FS}" fill="${s.color}" font-family="ui-monospace,monospace" letter-spacing="1.5">${s.key.toUpperCase()}（倍）</text>`
      + `<text x="${txTick}" y="${P.t+ih+13}" text-anchor="${anchorTick}" font-size="${FS-0.5}" fill="${s.color}" font-family="ui-monospace,monospace">${s.lo.toFixed(1)}</text>`
      + `<text x="${txTick}" y="${P.t-3}" text-anchor="${anchorTick}" font-size="${FS-0.5}" fill="${s.color}" font-family="ui-monospace,monospace">${s.hi.toFixed(1)}</text>`;
  };
  series.forEach(s=>{ g += axisLbl(s); });

  // 折线（逐段画，缺口处断开）
  series.forEach(s=>{
    s.segs.forEach(seg=>{
      if(seg.length < 2) return;
      g += `<polyline points="${seg.map(p=>p[0]+','+p[1]).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    });
  });
  // 点 + 标签（PE 标签在上，PB 标签在下；首末端点向内收，避免压住坐标轴刻度）
  // 十年窗口有 10 个点，逐年标注必然碰撞（PE 与 PB 在同一年数值接近时直接叠字）。
  // 策略：<= 6 个点时标全部中间点；> 6 个点时每条线只标「最高、最低、最近一个完整年」，
  // 极值比逐年数字更有信息量，且不会糊成一团。
  const dense = n > 6;
  const placedTxt = [];                     // 跨线全局避让：PE 与 PB 各自归一化，同年两点可能撞在一起
  series.forEach(s=>{
    const up = s.key === "pe";
    const m = s.pts.length;
    let keep = null;
    if(dense){
      let hi = 0, lo = 0;
      s.pts.forEach((p, i) => {
        if(p[2] > s.pts[hi][2]) hi = i;
        if(p[2] < s.pts[lo][2]) lo = i;
      });
      keep = new Set([hi, lo, m - 2]);
    }
    s.pts.forEach(([cx,cy,val,y],idx)=>{
      const isFirst = idx===0, isLast = idx===m-1;
      // 圆点每个都画（悬停可读到数值），只有文字标签按上面的策略省略
      g += `<circle cx="${cx}" cy="${cy}" r="3.2" fill="#fff" stroke="${s.color}" stroke-width="1.8"><title>${y} 年 ${s.key.toUpperCase()} ${val}</title></circle>`;
      const isExtreme = !!(keep && keep.has(idx));
      // 首末点一般不标（会压住轴刻度），但若它同时是极值就必须标——
      // 十年窗口里「最低 PE 出现在最后一年」很常见，漏掉等于丢掉最有信息量的那个数
      if((isFirst || isLast) && !isExtreme) return;
      if(dense && !isExtreme && !(idx === m - 2)) return;
      const ty = cy + (up ? -13 : 18);
      // 标签统一 1 位小数：原始值可能带 4 位小数（8.1756），字宽翻倍直接压住邻点。
      // 精确值保留在圆点的 <title> 里，悬停可读。
      const txt = (+val).toFixed(1);
      const halfW = txt.length * 2.9 + 2;
      // 按文字实际宽度避让，固定阈值会漏掉「数字长 → 压住邻居」的情况
      if(placedTxt.some(p => Math.abs(p[0]-cx) < p[2]+halfW+3 && Math.abs(p[1]-ty) < 11)) return;
      placedTxt.push([cx, ty, halfW]);
      const anchor = isFirst ? "start" : isLast ? "end" : "middle";
      const dx = isFirst ? 2 : isLast ? -2 : 0;
      g += `<text x="${cx+dx}" y="${ty}" text-anchor="${anchor}" font-size="${FS}" fill="${s.color}" font-family="ui-monospace,monospace" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round" class="ptlbl">${txt}</text>`;
    });
  });
  // x 轴
  h.forEach((d,i)=>{
    g += `<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="${FS}" fill="#b3aea2" font-family="ui-monospace,monospace">${d.y}</text>`;
  });

  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${v.asof} 起 ${h.length} 个年度末的 PE 与 PB 走势">${g}</svg>
    <div class="legend"><span><i style="background:#b4471f"></i>PE(TTM) 倍（左轴）</span><span><i style="background:#3d5a80"></i>PB 倍（右轴）</span><span class="legend-note">两条线各按自身区间缩放，只比形状不比高低</span></div></div>`;
}

/* 估值块（时点数值 + 10 年分位 + 走势） */
function valuationBlock(c){
  const v = c.valuation;
  if(!v) return "";
  const h = v.history || [];
  const p = v.pct || {};
  const st = v.pe_state || "ok";
  const loss = st === "loss";
  const y0 = v.pct_years ? v.pct_years[0] : null, y1 = v.pct_years ? v.pct_years[1] : null;
  const nW = h.length;                      // 实际样本年数（中间可能缺年，故不用 y1-y0+1）
  const win = (y0 && y1 && y0 !== y1) ? `${y0}–${y1}` : "历史窗口";
  const winFull = (y0 && y1 && y0 !== y1) ? `${y0}–${y1} 共 ${nW} 个年度末` : "历史窗口";
  // 上市晚于 2016 的公司窗口天然更短，分位可比性要如实说明，不能假装满 10 年。
  // 上市年必须用 listed 字段：years[0] 是「财报数据起始年」，招股书含上市前三年，
  // 拿它当上市年会把华熙生物（2019 上市）写成 2016 年上市。
  const listed = c.listed || ((c.years && c.years.length) ? c.years[0].y : null);
  const shortWin = (y0 && y1 && nW < 10)
    ? `该公司 ${listed || "—"} 年上市，估值窗口为 ${y0}–${y1} 共 ${nW} 年，分位可比性弱于满十年的公司。`
    : "";

  const peSub = loss ? "亏损，PE 无意义"
    : st === "void" ? "本年利润趋近零，PE 作废"
    : st === "thin" ? `仅 ${v.pe_valid_n} 个正 PE 样本，不算分位`
    : `${win} 分位 ${p.pe==null?'—':p.pe.toFixed(0)+'%'} · ${pctWord(p.pe)}`;
  const peVal = v.pe == null ? "—" : fmt(v.pe,2);

  const peKpi = `<div class="kpi"><div class="k">市盈率 PE(TTM)</div><div class="v">${peVal}${v.pe==null?'':'<small>倍</small>'}</div><div class="s">${peSub}</div></div>`;

  let note;
  if(loss){
    note = `该公司最新年度<b>归母净利为负，PE 为负值（${fmt(v.pe,2)} 倍），此时 PE 与「历史分位」都没有经济含义</b>——分母是亏损，算出来的是负数比率。判断这类公司看 <b>PB ${fmt(v.pb,2)} 倍（分位 ${p.pb==null?'—':p.pb.toFixed(0)+'%'} · ${pctWord(p.pb)}）</b>与现金流，不看 PE。走势图中的 PE 折线在转亏后断裂，正是这个原因。`;
  } else if(st === "void"){
    note = `当年<b>净利趋近于零</b>（微利或微亏），PE 被算到极端值后作废——它衡量的是「分母有多小」，不是「估值有多贵」。这种情况看 <b>PB ${fmt(v.pb,2)} 倍（分位 ${p.pb==null?'—':p.pb.toFixed(0)+'%'} · ${pctWord(p.pb)}）</b>。`;
  } else if(st === "thin"){
    note = `窗口内只有 <b>${v.pe_valid_n} 个有效正 PE 样本</b>（其余年份亏损或利润趋近零），不足 ${3} 个无法计算分位，此处不给 PE 分位以避免误导。PB 分位 ${p.pb==null?'—':p.pb.toFixed(0)+'%'}（${pctWord(p.pb)}）仍可参考。`;
  } else {
    note = `分位口径：<b>百分位法</b>，${winFull}取值为样本，0% = 窗口最低、100% = 窗口最高。当前 PE 处于 ${p.pe==null?'—':p.pe.toFixed(0)+'%'} 分位（${pctWord(p.pe)}）、PB 处于 ${p.pb==null?'—':p.pb.toFixed(0)+'%'} 分位（${pctWord(p.pb)}）。<b>分位低不等于便宜</b>——周期股在盈利顶点时 PE 最低；要结合 PB 与股息率一起看。`;
  }
  // 窗口不足十年这件事与 PE 状态无关，四个分支都要说，否则短窗口公司在
  // loss/void/thin 状态下会看起来「和满十年的一样可靠」
  if(shortWin && !note.includes(shortWin)) note += ` ${shortWin}`;

  return `
    <div class="block">
      <h3>估值与历史分位</h3>
      <div class="kpis" style="margin-bottom:20px">
        ${peKpi}
        <div class="kpi"><div class="k">市净率 PB</div><div class="v">${fmt(v.pb,2)}<small>倍</small></div><div class="s">${win} 分位 ${p.pb==null?'—':p.pb.toFixed(0)+'%'} · ${pctWord(p.pb)}</div></div>
        <div class="kpi"><div class="k">股息率 TTM</div><div class="v">${v.dy==null?'—':fmt(v.dy,2)+'%'}</div><div class="s">分位 ${p.dy==null?'—':p.dy.toFixed(0)+'%'}${p.dy!=null?' · '+pctWord(p.dy):''}</div></div>
        <div class="kpi"><div class="k">净利率</div><div class="v">${companyStats(c).nm==null?'—':companyStats(c).nm.toFixed(1)+'%'}</div><div class="s">归母净利/营收</div></div>
      </div>

      <div class="pctgrid">
        <div class="pctcell"><div class="pl">PE 分位${(loss||st==='void')?'（不适用）':''}</div>${pctBar(p.pe)}<div class="phint">${peSub}</div></div>
        <div class="pctcell"><div class="pl">PB 分位</div>${pctBar(p.pb)}<div class="phint">${pctWord(p.pb)}</div></div>
        <div class="pctcell"><div class="pl">股息率分位</div>${pctBar(p.dy)}<div class="phint">${pctWord(p.dy)}</div></div>
      </div>

      ${valChart(v)}

      <div class="cmp-note">数据截至 ${v.asof}（各年度末收盘）。${note} 分位样本 ${h.length} 个年度${loss||st==='void'?'，其中正 PE 样本 '+v.pe_valid_n+' 个':''}。</div>
    </div>`;
}

/* 同赛道横比表 */
function cmpTable(c, peers){
  const engTag = (x)=> ((x.engine||{}).main||"").split("（")[0];
  const rows = peers.map(p=>{
    const s = companyStats(p);
    const sel = p.code===c.code ? ' class="sel"' : '';
    return `<tr${sel} data-c="${p.code}"><td>${p.name}</td><td>${p.coverage[0]}–${p.coverage[1]}</td><td>${fmt(s.last.rev,0)}</td><td class="${s.last.np<0?'neg':''}">${fmt(s.last.np,0)}</td><td>${s.cagr==null?'—':s.cagr.toFixed(1)+'%'}</td><td>${s.last.gm==null?'—':s.last.gm.toFixed(1)+'%'}</td><td class="${s.nm!=null&&s.nm<0?'neg':''}">${s.nm==null?'—':s.nm.toFixed(1)+'%'}</td></tr>`;
  }).join("");
  const note = peers.map(p=>`<b>${p.name}</b>：${engTag(p)}`).join("；");
  return `
    <div class="cmp-scroll"><table class="cmp-table">
      <thead><tr><th>公司</th><th>覆盖</th><th>最新营收</th><th>最新净利</th><th>营收 CAGR</th><th>毛利率</th><th>净利率</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="cmp-note">同赛道差异归因（按货币化引擎）：${note}。点行可切换公司。</div>`;
}

function renderDetail(){
  const c = DATA.companies.find(x=>x.code===state.code);
  if(!c){ $("#detail").innerHTML = `<div class="empty">选择左侧公司查看拆解</div>`; return; }
  const ys = c.years;
  const st = companyStats(c);
  const first = st.first, last = st.last, cagr = st.cagr, npCagr = st.npCagr;

  const mix = (c.mix||[]).map(([k,v])=>`
    <div class="mix-row"><div class="nm">${k}</div><div class="bar"><i style="width:${v}%"></i></div><div class="pc">${v}%</div></div>`).join("");

  const rows = [...ys].reverse().map(d=>`
    <tr><td>${d.y}</td><td>${fmt(d.rev,1)}</td><td class="${d.np<0?'neg':''}">${fmt(d.np,1)}</td><td>${d.gm==null?'—':d.gm.toFixed(1)+'%'}</td></tr>`).join("");

  const flags = (c.flags||[]).map(f=>{
    const ok = f.startsWith("!");
    return `<li class="${ok?'ok':''}">${ok?f.slice(1):f}</li>`;
  }).join("");

  // 同赛道按申万二级分组：只有真正同一门生意才值得横向比
  // 单一公司的二级类目没有可比对象，回退到申万一级并说明原因
  const peers2 = DATA.companies.filter(x=>x.sw2 && x.sw2===c.sw2);
  const peers1 = DATA.companies.filter(x=>x.industry===c.industry);
  let cmpHtml = "";
  if(c.sw2 && peers2.length>=2){
    const isL2 = peers2.length < peers1.length;
    cmpHtml = `
    <div class="block">
      <h3>同赛道横比（${c.sw2} · ${peers2.length} 家）</h3>
      <div class="cmp-scope">申万二级 <b>${c.sw2_code||''} ${c.sw2}</b>${isL2?`；同一 <b>${c.industry}</b> 一级下还有 ${peers1.length-peers2.length} 家属于其他二级类目，不在本表`:"；本行业全部样本均在表内"}</div>
      ${cmpTable(c, peers2)}
    </div>`;
  } else if(peers1.length>=2){
    cmpHtml = `
    <div class="block">
      <h3>同赛道横比（${c.industry} · ${peers1.length} 家）</h3>
      <div class="cmp-scope">申万二级 <b>${c.sw2||"—"}</b> 只有本家，无可比对象，此处回退到申万一级列示其余 ${peers1.length} 家；<b>跨二级的毛利率与增速不能直接比</b>，仅作规模参照，差异请看下方引擎归因。</div>
      ${cmpTable(c, peers1)}
    </div>`;
  }

  $("#detail").innerHTML = `
    <div class="dhead">
      <div class="eyebrow">${c.industry}${c.sub?' / '+c.sub:''} · ${c.code}</div>
      <div style="display:flex;align-items:flex-start;gap:14px">
        <h2 style="flex:1;margin-bottom:0">${c.name}</h2>
        <button class="xbtn" id="xbtn">导出 Markdown</button>
      </div>
      <div class="meta">
        <span>${c.market || "A股"}</span>
        <span>上市 ${c.listed}</span>
        <span>覆盖 ${c.coverage[0]}–${c.coverage[1]}（${ys.length} 个财年）</span>
        <span>${c.engine ? c.engine.main : ""}</span>
      </div>
      <p class="verdict">${c.verdict}</p>
    </div>

    <div class="kpis">
      <div class="kpi"><div class="k">最新营收</div><div class="v">${fmt(last.rev, last.rev<100?1:0)}<small>亿</small></div><div class="s">${last.y} 年</div></div>
      <div class="kpi"><div class="k">最新净利</div><div class="v" style="color:${last.np<0?'var(--accent)':'inherit'}">${fmt(last.np, Math.abs(last.np)<100?1:0)}<small>亿</small></div><div class="s">归母净利润</div></div>
      <div class="kpi"><div class="k">营收 CAGR</div><div class="v">${cagr==null?'—':cagr.toFixed(1)+'%'}</div><div class="s">${first.y}–${last.y}</div></div>
      <div class="kpi"><div class="k">最新毛利率</div><div class="v">${last.gm==null?'—':last.gm.toFixed(1)+'%'}</div><div class="s">${npCagr==null?'':'净利 CAGR '+npCagr.toFixed(1)+'%'}</div></div>
    </div>

    <div class="block">
      <h3>上市以来：营收（柱）与归母净利（线）</h3>
      ${chart(c)}
    </div>

    <div class="block">
      <h3>收入结构</h3>
      <div class="mix">${mix || '<p style="color:var(--ink-4);font-size:12px">未拆分</p>'}</div>
    </div>

    <div class="block">
      <h3>四条轴上的位置</h3>
      <div class="grid2">
        <div class="box"><div class="lab">货币化引擎</div><p>${c.engine ? c.engine.desc : ""}</p><div class="kv">${c.engine ? c.engine.formula : ""}</div></div>
        <div class="box"><div class="lab">定价权来源</div><p>${c.moat}</p></div>
        <div class="box"><div class="lab">付费对象</div><p>${c.payer}</p></div>
        <div class="box"><div class="lab">五年变迁</div><p>${c.shift}</p></div>
      </div>
    </div>

    ${financialBlock(c)}

    <div class="block">
      <h3>红旗与观察点</h3>
      <ul class="flags">${flags || '<li class="ok">未触发阈值内红旗</li>'}</ul>
    </div>

    ${cmpHtml}

    <div class="block">
      <h3>年度数据（亿元）</h3>
      <table><thead><tr><th>年度</th><th>营业收入</th><th>归母净利</th><th>毛利率</th></tr></thead><tbody>${rows}</tbody></table>
    </div>

    ${valuationBlock(c)}

    <div class="foot">
      ${c.note || ""}<br>
      数据来源：上市公司年报（合并报表口径），经同花顺金融数据接口整理；金额单位人民币亿元。
      分析框架见 <a href="docs/methodology.md">方法论</a>。本文基于公开信息，不构成投资建议。
    </div>`;

  // 导出与横比交互
  const xb = $("#xbtn");
  if(xb) xb.onclick = ()=> exportMarkdown(c);
  const ct = $("#detail").querySelector(".cmp-table");
  if(ct) ct.onclick = e=>{
    const tr = e.target.closest("tr[data-c]"); if(!tr) return;
    state.code = tr.dataset.c;
    renderList(); renderDetail();
    window.scrollTo({top:0,behavior:"smooth"});
  };
}

/* 单家导出 Markdown */
function exportMarkdown(c){
  const st = companyStats(c);
  const rows = c.years.map(d=>`| ${d.y} | ${d.rev} | ${d.np} | ${d.gm==null?'—':d.gm.toFixed(1)}% |`).join("\n");
  const flags = (c.flags||[]).map(f=>`- ${f}`).join("\n");
  const mix = (c.mix||[]).map(([k,v])=>`- ${k}：${v}%`).join("\n");
  const finMd = c.financial ? `
## 金融机构专用指标
${c.financial.type==="bank" ? "| 年度 | 净息差 | 不良率 | 成本收入比 | 拨备覆盖率 | 加权ROE |\n|---|---|---|---|---|---|\n" : "| 年度 | 新业务价值(亿) | 内含价值(亿) | NBV率 |\n|---|---|---|---|\n"}
${c.financial.years.map(d=> c.financial.type==="bank" ? `| ${d.y} | ${d.nim}% | ${d.npl}% | ${d.cir}% | ${d.cov}% | ${d.roe}% |` : `| ${d.y} | ${d.nbv} | ${d.ev} | ${d.nbvm}% |`).join("\n")}` : "";
  const valMd = (()=>{
    const v = c.valuation;
    if(!v) return "";
    const p = v.pct || {};
    const st = v.pe_state || "ok";
    const loss = st === "loss";
    const win = (v.pct_years && v.pct_years[0]!==v.pct_years[1]) ? `${v.pct_years[0]}–${v.pct_years[1]} 共 ${(v.history||[]).length} 年` : "历史窗口";
    const peShow = loss ? `${v.pe} 倍（亏损，无意义）` : st === "void" ? "本年净利趋近零，PE 作废" : st === "thin" ? `仅 ${v.pe_valid_n} 个有效样本，不算分位` : `${v.pe} 倍`;
    const pcts = `- PE：${peShow}；PB：${v.pb} 倍；股息率 TTM：${v.dy==null?'—':v.dy+'%'}
- 历史分位（${win}）：PE ${(loss||st==='void'||st==='thin'||p.pe==null)?'不适用':p.pe.toFixed(0)+'%'}、PB ${p.pb==null?'—':p.pb.toFixed(0)+'%'}、股息率 ${p.dy==null?'—':p.dy.toFixed(0)+'%'}`;
    const tbl = (v.history||[]).length ? `
### 估值序列（各年度末）

| 年度 | PE(TTM) | PB | 股息率 TTM |
|---|---|---|---|
${v.history.map(d=>`| ${d.y} | ${d.pe==null?'—':d.pe.toFixed(2)} | ${d.pb==null?'—':d.pb.toFixed(2)} | ${d.dy==null?'—':d.dy.toFixed(2)+'%'} |`).join("\n")}` : "";
    const warn = loss ? `\n> 最新年度亏损，PE 为 ${v.pe} 倍（负值），此时 PE 与 PE 分位无经济含义，判断请看 PB 与现金流。`
      : st === "void" ? `\n> 当年净利趋近于零，PE 被算到极端值后作废；判断请看 PB 与现金流。`
      : st === "thin" ? `\n> 窗口内仅 ${v.pe_valid_n} 个有效正 PE 样本，不足 3 个不计算 PE 分位。`
      : "";
    return `
## 估值（截至 ${v.asof}）
${pcts}
${tbl}${warn}`;
  })();
  const md = `# ${c.name}（${c.code}）商业模式拆解

> ${(c.verdict||"").split("<b>").join("").split("</b>").join("")}

- 行业：${c.industry}${c.sub?' / '+c.sub:''}（${c.market||"A股"}）
- 上市：${c.listed}，覆盖 ${c.coverage[0]}–${c.coverage[1]}（${c.years.length} 个财年）
- 最新营收：${c.years.at(-1).rev} 亿元；最新归母净利：${c.years.at(-1).np} 亿元
- 营收 CAGR：${st.cagr==null?'—':st.cagr.toFixed(1)+'%'}；最新毛利率：${c.years.at(-1).gm==null?'—':c.years.at(-1).gm.toFixed(1)+'%'}

## 货币化引擎
${c.engine?c.engine.desc:""}
${c.engine?c.engine.formula:""}

## 收入结构
${mix}

## 定价权来源
${c.moat}

## 付费对象
${c.payer}

## 五年变迁
${c.shift}

## 红旗与观察点
${flags}
${finMd}${valMd}
## 年度数据（亿元）
| 年度 | 营业收入 | 归母净利 | 毛利率 |
|---|---|---|---|
${rows}

${c.note?"备注："+c.note:""}
`;
  const blob = new Blob([md], {type:"text/markdown;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${c.code}_${c.name}.md`;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* 引擎短标签 */
function engineTag(c){
  const e = (c.engine||{}).main||"";
  const tags = [];
  if(/E1/.test(e)) tags.push("E1广告");
  if(/E2/.test(e)) tags.push("E2佣金");
  if(/E3/.test(e)) tags.push("E3自营");
  if(/E4/.test(e)) tags.push("E4履约");
  if(/E5/.test(e)) tags.push("E5订阅");
  if(/E6/.test(e)) tags.push("E6金融");
  if(/E7/.test(e)) tags.push("E7云");
  if(/E8/.test(e)) tags.push("E8交付");
  if(/E9/.test(e)) tags.push("E9资源");
  return tags.length?tags.join("+"):"其他";
}

/* 年度横切面 */
function renderCross(){
  const allYears = [...new Set(DATA.companies.flatMap(c=>c.years.map(d=>d.y)))].sort((a,b)=>b-a);
  const opts = allYears.map(y=>`<option value="${y}"${y===allYears[0]?' selected':''}>${y}</option>`).join("");
  $("#detail").innerHTML = `
    <div class="xs-toolbar">
      <h2 style="font-size:22px;font-weight:700;letter-spacing:-.02em">年度横切面</h2>
      <select id="xsYear">${opts}</select>
      <div style="font-size:11.5px;color:var(--ink-4)">选择某一年，看全样本的引擎分布与行业扩张/收缩</div>
    </div>
    <div id="xsBody"></div>`;
  $("#xsYear").onchange = e => crossYear(+e.target.value);
  crossYear(allYears[0]);
}

function crossYear(year){
  const prevYear = year - 1;
  const rows = DATA.companies.map(c=>{
    const y = c.years.find(d=>d.y===year);
    const p = c.years.find(d=>d.y===prevYear);
    return {c, y, p};
  }).filter(x=>x.y);

  const rev = rows.reduce((s,x)=>s+x.y.rev,0);
  const np = rows.reduce((s,x)=>s+x.y.np,0);
  const profit = rows.filter(x=>x.y.np>0).length;

  const indMap = {};
  rows.forEach(x=>{
    const k = x.c.industry;
    indMap[k] = indMap[k] || {rev:0, np:0, n:0, gmSum:0, gmN:0};
    indMap[k].rev += x.y.rev; indMap[k].np += x.y.np; indMap[k].n++;
    if(x.y.gm!=null){ indMap[k].gmSum += x.y.gm; indMap[k].gmN++; }
  });
  const inds = Object.entries(indMap).sort((a,b)=>b[1].rev-a[1].rev);
  const indRows = inds.map(([k,v])=>{
    const gm = v.gmN? (v.gmSum/v.gmN).toFixed(1)+'%' : '—';
    const nm = v.rev>0? (v.np/v.rev*100).toFixed(1)+'%' : '—';
    return `<tr><td>${k}</td><td>${v.n}</td><td>${fmt(v.rev,0)}</td><td class="${v.np<0?'neg':''}">${fmt(v.np,0)}</td><td>${gm}</td><td>${nm}</td></tr>`;
  }).join("");

  const engMap = {};
  rows.forEach(x=>{
    const e = engineTag(x.c);
    engMap[e] = engMap[e] || {rev:0, n:0};
    engMap[e].rev += x.y.rev; engMap[e].n++;
  });
  const engs = Object.entries(engMap).sort((a,b)=>b[1].rev-a[1].rev);
  const maxRev = Math.max(...engs.map(e=>e[1].rev), 1);
  const engRows = engs.map(([k,v])=>`
    <div class="mix-row"><div class="nm">${k}（${v.n} 家）</div><div class="bar"><i style="width:${(v.rev/maxRev*100).toFixed(1)}%"></i></div><div class="pc">${fmt(v.rev,0)}</div></div>`).join("");

  const growth = rows.filter(x=>x.p && x.p.rev>0).map(x=>({
    name: x.c.name, g: (x.y.rev/x.p.rev - 1)*100
  })).sort((a,b)=>b.g-a.g);
  const up = growth.filter(x=>x.g>0).slice(0,5);
  const down = growth.filter(x=>x.g<0).slice(-5).reverse();

  $("#xsBody").innerHTML = `
    <div class="xs-stats">
      <div class="xs-stat"><div class="k">样本公司</div><div class="v">${rows.length}</div><div class="s">${year} 年有数据</div></div>
      <div class="xs-stat"><div class="k">营收合计</div><div class="v">${fmt(rev,0)}</div><div class="s">亿元</div></div>
      <div class="xs-stat"><div class="k">净利合计</div><div class="v" style="color:${np<0?'var(--accent)':'inherit'}">${fmt(np,0)}</div><div class="s">亿元</div></div>
      <div class="xs-stat"><div class="k">盈利公司</div><div class="v">${profit}<span style="font-size:.55em;color:var(--ink-3)"> / ${rows.length}</span></div><div class="s">${(profit/rows.length*100).toFixed(0)}%</div></div>
    </div>

    <div class="block">
      <h3>行业横切面（${year}）</h3>
      <div class="cmp-scroll"><table><thead><tr><th>行业</th><th>公司数</th><th>营收</th><th>净利</th><th>平均毛利率</th><th>净利率</th></tr></thead><tbody>${indRows}</tbody></table></div>
    </div>

    <div class="block">
      <h3>货币化引擎分布（${year}）</h3>
      <div class="box">${engRows || '<p style="color:var(--ink-4);font-size:12px">无数据</p>'}</div>
    </div>

    <div class="grid2">
      <div class="box"><div class="lab">营收增速最快（较 ${prevYear}）</div>
        ${up.map(x=>`<div style="display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line)"><span>${x.name}</span><span class="growth-pos" style="font-family:var(--mono)">+${x.g.toFixed(1)}%</span></div>`).join("") || '<p style="color:var(--ink-4);font-size:12px">—</p>'}
      </div>
      <div class="box"><div class="lab">营收收缩最快（较 ${prevYear}）</div>
        ${down.map(x=>`<div style="display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line)"><span>${x.name}</span><span class="growth-neg" style="font-family:var(--mono)">${x.g.toFixed(1)}%</span></div>`).join("") || '<p style="color:var(--ink-4);font-size:12px">—</p>'}
      </div>
    </div>`;
}

renderList();
renderDetail();
</script>
</body>
</html>
